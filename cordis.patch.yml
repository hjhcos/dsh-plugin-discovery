- insert:
    - id: plugin-discovery
      name: 'dsh-plugin-discovery'
      config:
        enabled: true
        searchCacheTtlMs: 300000
        maxCandidates: 40
        maxInspect: 10
        githubToken: ""
        openPanelOnLoad: false
        # 推荐目录远程自动更新：优先 Gitee raw，失败再试 GitHub；按 JSON version 升级本地缓存
        catalogRemoteEnabled: true
        catalogGiteeUrl: 'https://gitee.com/hjhcos/dsh-plugin-discovery/raw/main/data/recommended.json'
        catalogGithubUrl: 'https://raw.githubusercontent.com/hjhcos/dsh-plugin-discovery/main/data/recommended.json'
        catalogRefreshTtlMs: 3600000
        # 本插件自动检查 npm 最新版（Gitee package.json 兜底）；非 file: 安装时可自动更新
        selfUpdateCheckEnabled: true
        selfUpdateAuto: true
        selfUpdateCheckTtlMs: 21600000
